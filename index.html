<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FL0W3R</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin-top: 50px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #bd00ff;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 40px;
        }

        .search-box {
            position: relative;
            margin-bottom: 40px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: #bd00ff;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .link-item {
            text-decoration: none;
            color: #555;
            font-weight: bold;
            padding: 10px 20px;
            border: 1px solid #eee;
            border-radius: 15px;
            transition: all 0.3s;
        }

        .link-item:hover {
            background-color: #bd00ff;
            color: white;
            border-color: #bd00ff;
        }

        footer {
            margin-top: auto;
            padding: 20px;
            color: #aaa;
            font-size: 0.9rem;
        }

        /* Optional: Add your SVG logo if you have one */
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo Area -->
        <img src="site.svg" alt="Logo" class="logo">
        
        <h1>Welcome to My Site</h1>
        <p class="subtitle">✿ FL0W3R<br>Local browser shell<br>A LITTLE SPACE TO EXPLORE</p>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" placeholder="Search the web or enter a website address...">
        </div>

        <!-- Quick Links -->
        <div class="links">
            <a href="https://duckduckgo.com" class="link-item">◉ DuckDuckGo ✧</a>
            <a href="https://wikipedia.org" class="link-item">▶ Wikipedia</a>
            <a href="https://youtube.com" class="link-item">⌘ YouTube</a>
            <a href="https://github.com" class="link-item">GitHub</a>
        </div>
    </div>

    <footer>
        Made to bloom ✿
    </footer>

</body>
</html>
